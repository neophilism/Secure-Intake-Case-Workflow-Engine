# Reviewed immutable RC image. Keep the web preview free; a full deployment also needs a durable worker.
# The worker blueprint is deliberately separate to avoid purchasing a paid instance by mistake.
services:
  - type: web
    name: secure-intake-engine
    runtime: image
    image: ghcr.io/neophilism/secure-intake-case-workflow-engine@sha256:cfbea03ffb3e652b904340990085cb1c039a14731ab9d35f460c10e543cdf9df
    plan: free
    region: ohio
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: DOCUMENT_STORAGE_DRIVER
        value: s3
      - key: DOCUMENT_S3_ENDPOINT
        sync: false
      - key: DOCUMENT_S3_REGION
        value: us-east-2
      - key: DOCUMENT_S3_BUCKET
        sync: false
      - key: DOCUMENT_S3_ACCESS_KEY_ID
        sync: false
      - key: DOCUMENT_S3_SECRET_ACCESS_KEY
        sync: false
      - key: MALWARE_SCANNER_URL
        sync: false
      - key: MALWARE_SCANNER_PROVIDER
        sync: false
      - key: PROTECTED_DATA_ENCRYPTION_KEY
        sync: false
      - key: WEBHOOK_ENCRYPTION_KEY
        sync: false
previews:
  generation: none

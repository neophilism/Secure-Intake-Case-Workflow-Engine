name: Release container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casework
          POSTGRES_PASSWORD: casework
          POSTGRES_DB: casework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casework -d casework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://casework:casework@localhost:5432/casework
      APP_BASE_URL: http://localhost:3000
      PROTECTED_DATA_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
      IMAGE_NAME: ghcr.io/neophilism/secure-intake-case-workflow-engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag version $tag_version does not match package version $package_version." >&2
            exit 1
          fi

      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run verify:release-contract
      - run: npm run test:a11y
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Write immutable release evidence
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          node scripts/write-release-evidence.mjs \
            --image "$IMAGE_NAME" \
            --digest "$IMAGE_DIGEST" \
            --source "$GITHUB_SHA" \
            --tag "$GITHUB_REF_NAME" \
            --out release-evidence.json

      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: container-release-evidence-${{ github.ref_name }}
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90

      - name: Summarize immutable release
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "## Container release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: $(node -p "require('./package.json').version")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable image: $IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "- Provenance: enabled" >> "$GITHUB_STEP_SUMMARY"
          echo "- SBOM: enabled" >> "$GITHUB_STEP_SUMMARY"

name: Dispatch release request

on:
  push:
    branches:
      - main
    paths:
      - release-request.json

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release request
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: request
        name: Validate immutable release request
        run: >-
          node scripts/validate-release-request.mjs
          --file release-request.json
          --github-output "$GITHUB_OUTPUT"

      - name: Dispatch validated release workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
          RELEASE_SOURCE_REF: ${{ steps.request.outputs.source_ref }}
        run: >-
          gh workflow run release.yml
          --ref main
          --field "version=$RELEASE_VERSION"
          --field "source_ref=$RELEASE_SOURCE_REF"

      - name: Summarize release dispatch
        run: |
          echo "## Engine release request dispatched" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: `${{ steps.request.outputs.version }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: `${{ steps.request.outputs.source_ref }}`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: `release.yml`" >> "$GITHUB_STEP_SUMMARY"

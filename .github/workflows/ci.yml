name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casework
          POSTGRES_PASSWORD: casework
          POSTGRES_DB: casework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casework -d casework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://casework:casework@localhost:5432/casework
      APP_BASE_URL: http://localhost:3000
      PROTECTED_DATA_ENCRYPTION_KEY: "1111111111111111111111111111111111111111111111111111111111111111"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run verify:release-contract
      - name: Verify release evidence writer
        run: |
          node scripts/write-release-evidence.mjs \
            --image ghcr.io/neophilism/secure-intake-case-workflow-engine \
            --digest sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --source bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --tag "v$(node -p "require('./package.json').version")" \
            --out /tmp/release-evidence.json
          test -s /tmp/release-evidence.json
      - name: Verify release workflow dispatch contract
        run: |
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml")'
          grep -q "workflow_dispatch:" .github/workflows/release.yml
          grep -q 'tags:' .github/workflows/release.yml
          grep -q 'Create manual release tag after validation' .github/workflows/release.yml
          grep -q 'softprops/action-gh-release@v2' .github/workflows/release.yml
          grep -q 'release-evidence.json' .github/workflows/release.yml
          grep -q 'steps.context.outputs.source_sha' .github/workflows/release.yml
          grep -q 'steps.build.outputs.digest' .github/workflows/release.yml
      - name: Verify immutable release request automation
        run: |
          node -e '
            const fs = require("fs");
            const version = require("./package.json").version;
            fs.writeFileSync("/tmp/release-request.json", JSON.stringify({
              schemaVersion: 1,
              version,
              sourceRef: "a".repeat(40)
            }));
            fs.writeFileSync("/tmp/invalid-release-request.json", JSON.stringify({
              schemaVersion: 1,
              version,
              sourceRef: "main"
            }));
          '
          node scripts/validate-release-request.mjs --file /tmp/release-request.json
          node scripts/validate-release-request.mjs --file release-request.json
          if node scripts/validate-release-request.mjs --file /tmp/invalid-release-request.json; then
            echo "Release request validator accepted a mutable source ref." >&2
            exit 1
          fi
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release-request.yml")'
          grep -q 'release-request.json' .github/workflows/release-request.yml
          grep -q 'actions: write' .github/workflows/release-request.yml
          grep -q 'gh workflow run release.yml' .github/workflows/release-request.yml
      - run: node scripts/test-production-environment.mjs
      - run: node scripts/test-probe-public.mjs
      - run: npm run test:a11y
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
      - run: docker build -t secure-intake-case-workflow-engine:ci .

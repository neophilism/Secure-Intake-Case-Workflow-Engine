name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: casework
          POSTGRES_PASSWORD: casework
          POSTGRES_DB: casework
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casework -d casework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://casework:casework@localhost:5432/casework
      APP_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run verify:release-contract
      - run: npm run test:a11y
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
